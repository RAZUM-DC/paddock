# Optional override: harnesses on demand, one internal network per user.
#   docker compose -f docker-compose.yml -f docker-compose.provisioner.yml up -d --build
# (or add it to COMPOSE_FILE in .env, after docker-compose.yml).
#
# - provisioner: the only container with the Docker socket. It is on `control` only, which it shares with web,
#   and creates harness-<id> on its own internal network paddock-u-<id> (see docs/services/provisioner/README.md).
# - web and egress get fixed container names, because the provisioner attaches them to every user network by name.
# - Harnesses made by add-user.sh keep working on `core` as before; both kinds can run side by side.
#
# Secrets (not in git):
#   secrets/provisioner.env  PROVISIONER_TOKEN=<openssl rand -hex 32>  (+ optional HARNESS_*, LLM_*, MCP_SERVERS_JSON,
#                            MAX_HARNESSES, DOCKER_API_VERSION)
#   secrets/web.env          PROVISIONER_URL=http://provisioner:8080  PROVISIONER_TOKEN=<the same value>
#   secrets/user-env/<id>.env  optional per-user env for the harness (e.g. LLM_API_KEY=...)
# The harness image must exist locally: docker compose --profile images build harness-image

networks:
  # Fixed Linux bridge names (so host firewall rules can match pd-* / pu*) and a fixed core subnet, so the edge
  # can have a static address that web trusts for X-Forwarded-For (TRUSTED_PROXIES). Changing driver_opts or ipam of
  # an existing network needs `docker compose down` (volumes are kept) before `up`.
  core:
    driver_opts:
      com.docker.network.bridge.name: pd-core
    ipam:
      config:
        - subnet: ${PADDOCK_CORE_SUBNET:-172.20.1.0/24}
  outside:
    driver_opts:
      com.docker.network.bridge.name: pd-out
    ipam:
      config:
        - subnet: ${PADDOCK_OUTSIDE_SUBNET:-172.20.2.0/24}
  # web ↔ provisioner only. internal: no way out; neither egress nor any harness is ever attached, so nothing a
  # harness can steer (its own traffic, or the egress proxy) can reach the provisioner.
  control:
    internal: true
    # Every network here has a fixed subnet: one left to the default pool can take a subnet another one is about to
    # claim (compose creates them in parallel) and fail with "Pool overlaps".
    ipam:
      config:
        - subnet: ${PADDOCK_CONTROL_SUBNET:-172.20.9.0/24}
  # web → the gost API of egress (egress-api:18080). gost serves its API on every interface, so a host firewall should
  # allow port 18080 only on this bridge (pd-eapi). Change the subnet if it overlaps a network you have.
  egress-api:
    internal: true
    driver_opts:
      com.docker.network.bridge.name: pd-eapi
    ipam:
      config:
        - subnet: ${PADDOCK_EGRESS_API_SUBNET:-10.254.254.0/29}

services:
  web:
    container_name: paddock-web
    networks: [core, control, egress-api]
    environment:
      # The gost API through `egress-api` (the alias exists on no user network).
      GOST_API: http://egress-api:18080/api
      NO_PROXY: localhost,127.0.0.1,web,egress,egress-api,provisioner
      # Only the edge may pass X-Forwarded-For (lib/client-ip.ts); add the proxy in front of the edge to
      # TRUSTED_PROXY_HOPS in secrets/web.env (the address the edge sees it connect from).
      TRUSTED_PROXIES: 127.0.0.1,::1,${PADDOCK_EDGE_IP:-172.20.1.250}

  edge:
    networks:
      core:
        ipv4_address: ${PADDOCK_EDGE_IP:-172.20.1.250}
      outside: {}

  egress:
    container_name: paddock-egress
    networks:
      # Static, so the host firewall can drop connections egress opens on core (DNS rebinding through the proxy to
      # a core address, e.g. <core ip>.nip.io); EGRESS_MAC does the same on user networks (provisioner).
      core:
        ipv4_address: ${PADDOCK_EGRESS_IP:-172.20.1.251}
      outside: {}
      egress-api:
        aliases: [egress-api]

  provisioner:
    build: ./provisioner
    container_name: paddock-provisioner
    env_file: ./secrets/provisioner.env
    environment:
      PROVISIONER_CONTAINER: paddock-provisioner
      WEB_CONTAINER: paddock-web
      EGRESS_CONTAINER: paddock-egress
      TOKENS_DIR: /run/secrets/tokens
      USER_ENV_DIR: /run/secrets/user-env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Written here (token files), read by web (ro) and bind-mounted into each harness from the host path.
      - ./secrets/tokens:/run/secrets/tokens
      - ./secrets/user-env:/run/secrets/user-env:ro
    networks: [control]
    restart: unless-stopped
    read_only: true
    # Root in the container (the socket is root-equivalent anyway); DAC_OVERRIDE only to write token files into
    # secrets/tokens, which belongs to the host user who ran add-user.sh.
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.5

  # Build-only: the image the provisioner starts harnesses from (users/*.yml build it too, when there are any).
  harness-image:
    build: ./codex
    image: paddock-harness-codex
    profiles: [images]
    entrypoint: ["true"]
    network_mode: none
